name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      EXPO_NO_TELEMETRY: 1
      EXPO_PUBLIC_API_URL: https://rpw-boosterxd.onrender.com/api/fb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('artifacts/rpw-mobile/android/**/*.gradle*', 'artifacts/rpw-mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      - name: Expo Prebuild
        working-directory: artifacts/rpw-mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Patch build.gradle (arm64-v8a splits + R8 minify)
        working-directory: artifacts/rpw-mobile
        run: |
          python3 - << 'PYEOF'
          import re

          path = "android/app/build.gradle"
          with open(path) as f:
              c = f.read()

          # Add ABI splits only (ndk abiFilters conflicts with splits — do NOT add both)
          if "splits {" not in c:
              splits = """
              splits {
                  abi {
                      enable true
                      reset()
                      include "arm64-v8a"
                      universalApk false
                  }
              }
          """
              c = c.replace("    buildTypes {", splits + "    buildTypes {", 1)

          # Strip any existing ndk abiFilters block to avoid Gradle conflict
          c = re.sub(r'\s*ndk\s*\{[^}]*abiFilters[^}]*\}', '', c)

          # Enable R8 minify for smaller APK
          c = re.sub(r'minifyEnabled\s+false', 'minifyEnabled true', c)

          with open(path, "w") as f:
              f.write(c)
          print("Patched: arm64-v8a splits + R8 minify (no conflicting abiFilters)")
          PYEOF

      - name: Make gradlew executable
        run: chmod +x artifacts/rpw-mobile/android/gradlew

      - name: Build Debug APK
        working-directory: artifacts/rpw-mobile/android
        run: ./gradlew app:assembleDebug --no-daemon --build-cache --parallel -x lint -x test
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.jvmargs=-Xmx4g
            -XX:MaxMetaspaceSize=512m
            -Dkotlin.incremental=false

      - name: Show APK size
        run: |
          APK=$(find artifacts/rpw-mobile/android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          ls -lh "$APK"
          echo "SIZE=$(du -sh "$APK" | cut -f1)" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPW-BOOSTER-arm64-${{ github.run_number }}
          path: artifacts/rpw-mobile/android/app/build/outputs/apk/debug/
          retention-days: 90

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.${{ github.run_number }}
          name: "RPW BOOSTER v1.5.${{ github.run_number }}"
          body: |
            ## RPW BOOSTER — Android APK

            **Build:** #${{ github.run_number }} | **Arch:** arm64-v8a | **Size:** ${{ env.SIZE }}
            **API:** https://rpw-boosterxd.onrender.com

            ### Install
            1. Download `app-debug.apk` below
            2. Android: **Settings → Security → Install unknown apps → Allow**
            3. Open APK → Install → Open RPW BOOSTER → paste FB cookie → Login

            *Auto-built via GitHub Actions*
          files: artifacts/rpw-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
